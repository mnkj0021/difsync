# DifSync ingress - HTTP bootstrap only
# This file is intentionally isolated to difsync.com and proxies only to
# the private DifSync listener. It does not modify or include other apps.

server {
    listen 80;
    listen [::]:80;
    server_name difsync.com www.difsync.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
