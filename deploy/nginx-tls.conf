# Install only after Let's Encrypt certificates exist.
# Validate with nginx -t before reloading.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name difsync.com www.difsync.com;

    ssl_certificate /etc/letsencrypt/live/difsync.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/difsync.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;

    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name difsync.com www.difsync.com;
    return 301 https://difsync.com$request_uri;
}
